<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidWars Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: url('bg.jpeg') no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;          /* vertical center */
            justify-content: flex-end;    /* right side */
            padding-right: 8%;
        }

        /* Glassmorphism Card */
        .login-card {
            width: 380px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            height: auto;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: block;
            object-fit: contain;
            border-radius: 50%;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.15));
        }

        h2 {
            color: #1a1a1a;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 11px;
            color: #444;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            background: #fff;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #e5c06d, #b8860b);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .footer-links {
            margin-top: 20px;
        }

        .footer-links a {
            color: #444;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }


        /* Mobile */
        @media (max-width: 480px) {
            body {
                justify-content: center;
                padding-right: 0;
            }

            .login-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="bwlogo.png" alt="BidWars Logo" class="logo">

        <h2>BIDWARS</h2>
        <p class="subtitle">The Auction Platform</p>

        <form>
            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button class="login-btn">LOGIN</button>
        </form>

        <div class="footer-links">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
